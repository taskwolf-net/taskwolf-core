stages:
  - test
  - build
  - deploy

before_script:
  - export DULNO_GITLAB_PRIVATE_TOKEN="$DULNO_GITLAB_PRIVATE_TOKEN"

test:
  stage: test
  image: gradle:8.5-jdk21
  script:
    - gradle test

build:
  stage: build
  image: gradle:8.5-jdk21
  artifacts:
    paths:
      - build/libs/core-1.0.0-SNAPSHOT.jar
      - build/docs/javadoc
    expire_in: 1 day
  script:
    - gradle assemble
    - gradle javadoc

deploy:
  stage: deploy
  image: alpine:latest
  when: manual
  script:
    - chmod og= $ID_RSA
    - apk update && apk add openssh-client
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "/home/taskwolf/deployment/fetch-core.sh && /home/taskwolf/deployment/deploy-core.sh && /home/taskwolf/deployment/deploy-nginx.sh"