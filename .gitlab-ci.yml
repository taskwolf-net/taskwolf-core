stages:
  - test
  - build
  - deploy

before_script:
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME
  - export TASKWOLF_GITLAB_PRIVATE_TOKEN="$TASKWOLF_GITLAB_PRIVATE_TOKEN"

test:
  stage: test
  image: openjdk:21
  script:
    - ./gradlew test

build:
  stage: build
  image: openjdk:21
  artifacts:
    paths:
      - build/libs/core-1.0.0-SNAPSHOT.jar
      - build/docs/javadoc
    expire_in: 1 day
  script:
    - ./gradlew assemble
    - ./gradlew javadoc

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - chmod og= $ID_RSA
    - apk update && apk add openssh-client
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "/home/taskwolf/deployment/core.sh"